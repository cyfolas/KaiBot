[package]
name = "axiom"
version = "0.2.0"
edition = "2024"
# Минимум sqlx 0.9.
rust-version = "1.94"
description = "Axiom — Discord-бот на Rust и Serenity: администрация, режимы доступа, журналы сервера"
license = "MIT"
publish = false

[dependencies]
dotenvy = "0.15"
# Без `framework`/`standard_framework`: бот работает только через взаимодействия, их маршрутизация —
# собственный модуль `framework`.
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "cache",
    "chrono",
    "client",
    "gateway",
    "http",
    "model",
    "utils",
    "rustls_backend",
] }
# Не используется напрямую: включает SOCKS в reqwest, через который serenity ходит в REST API.
# Без этого прокси вида `HTTPS_PROXY=socks5h://…` из окружения ломает все HTTP-запросы.
reqwest = { version = "0.12", default-features = false, features = ["socks"] }
# Настройки серверов. SQLite встроен в бинарник, миграции — тоже (`sqlx::migrate!`, см. build.rs).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Билдеры serenity сериализуются в JSON — так тесты проверяют то, что уйдёт в Discord.
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Единый стиль модулей: `foo.rs` рядом с каталогом `foo/`, без `mod.rs`.
mod_module_files = "warn"
